name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The PR #5 bug class: a refit that reached curves.json but never the
      # embedded copy in estimate.js, so the site's claims and every estimator
      # answer contradicted each other for weeks.
      - name: curves.json <-> estimate.js sync
        run: python3 build/sync_estimate_js.py --check

      - name: headline claims vs estimator (Python + JS)
        run: python3 build/test_headlines.py

      - name: optimizer parity (Python vs JS)
        run: python3 build/test_optimize.py

      - name: Worker unit tests (bundled estimator)
        run: node api/test_worker.mjs

      # The deployed Worker bundles estimate.js at deploy time, so it can
      # silently drift after a refit even when the repo is consistent.
      # Non-blocking until a redeploy is confirmed current; then promote.
      - name: deployed Worker agrees with the repo (non-blocking)
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          import json, sys, urllib.request
          sys.path.insert(0, "build")
          import estimate
          repo = estimate.estimate(7.0, "ada", "NF4")["delta_pct"]
          url = ("https://ecocompute-estimator.zhanghongping1982.workers.dev"
                 "/v1/estimate?params_b=7&arch=ada&precision=NF4")
          try:
              req = urllib.request.Request(url, headers={
                  # workers.dev sits behind Cloudflare bot rules that 403 the
                  # default Python-urllib UA from datacenter IPs
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                                "AppleWebKit/537.36 (KHTML, like Gecko) "
                                "Chrome/126.0 Safari/537.36"})
              live = json.load(urllib.request.urlopen(req, timeout=20))["delta_pct"]
          except Exception as e:
              print("WARN: deployed Worker unreachable: %s" % e)
              raise SystemExit(1)
          print("deployed Worker: %s%%   repo estimator: %s%%" % (live, repo))
          if (live < 0) != (repo < 0):
              print("FAIL: the deployed Worker contradicts the repo estimator "
                    "(the PR-5 bug class). Redeploy: cd api && npx wrangler deploy")
              raise SystemExit(1)
          print("OK: deployed Worker and repo estimator agree in direction")
          EOF

      # The deployed Worker's MCP surface: initialize handshake + one real
      # tool call. Non-blocking while the transport is new; promote once the
      # registry submission depends on it.
      - name: deployed /mcp smoke test (non-blocking)
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          import json, urllib.request
          url = "https://ecocompute-estimator.zhanghongping1982.workers.dev/mcp"
          hdrs = {
              "Content-Type": "application/json",
              "Accept": "application/json, text/event-stream",
              # Cloudflare bot rules 403 the default urllib UA (see above)
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                            "AppleWebKit/537.36 (KHTML, like Gecko) "
                            "Chrome/126.0 Safari/537.36"}

          def rpc(payload):
              req = urllib.request.Request(
                  url, data=json.dumps(payload).encode(), headers=hdrs, method="POST")
              return json.load(urllib.request.urlopen(req, timeout=20))

          init = rpc({"jsonrpc": "2.0", "id": 1, "method": "initialize",
                      "params": {"protocolVersion": "2025-03-26", "capabilities": {},
                                 "clientInfo": {"name": "ci-smoke", "version": "0.1"}}})
          server = init["result"]["serverInfo"]["name"]
          tools = rpc({"jsonrpc": "2.0", "id": 2, "method": "tools/list"})
          names = sorted(t["name"] for t in tools["result"]["tools"])
          call = rpc({"jsonrpc": "2.0", "id": 3, "method": "tools/call",
                      "params": {"name": "estimate_quantization_energy",
                                 "arguments": {"params_b": 7, "arch": "ada", "precision": "NF4"}}})
          text = call["result"]["content"][0]["text"]
          print("server: %s   tools: %s" % (server, ", ".join(names)))
          print("estimate(7B ada NF4) says: %s" % text.splitlines()[0])
          if len(names) != 4 or "-28." not in text:
              print("FAIL: MCP surface incomplete or wrong answer")
              raise SystemExit(1)
          print("OK: deployed /mcp answers with all four tools")
          EOF
