name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The PR #5 bug class: a refit that reached curves.json but never the
      # embedded copy in estimate.js, so the site's claims and every estimator
      # answer contradicted each other for weeks.
      - name: curves.json <-> estimate.js sync
        run: python3 build/sync_estimate_js.py --check

      - name: headline claims vs estimator (Python + JS)
        run: python3 build/test_headlines.py

      - name: optimizer parity (Python vs JS)
        run: python3 build/test_optimize.py

      - name: Worker unit tests (bundled estimator)
        run: node api/test_worker.mjs

      # The deployed Worker bundles estimate.js at deploy time, so it can
      # silently drift after a refit even when the repo is consistent.
      # Non-blocking until a redeploy is confirmed current; then promote.
      - name: deployed Worker agrees with the repo (non-blocking)
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          import json, sys, urllib.request
          sys.path.insert(0, "build")
          import estimate
          repo = estimate.estimate(7.0, "ada", "NF4")["delta_pct"]
          url = ("https://ecocompute-estimator.zhanghongping1982.workers.dev"
                 "/v1/estimate?params_b=7&arch=ada&precision=NF4")
          try:
              req = urllib.request.Request(url, headers={
                  # workers.dev sits behind Cloudflare bot rules that 403 the
                  # default Python-urllib UA from datacenter IPs
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                                "AppleWebKit/537.36 (KHTML, like Gecko) "
                                "Chrome/126.0 Safari/537.36"})
              live = json.load(urllib.request.urlopen(req, timeout=20))["delta_pct"]
          except Exception as e:
              print("WARN: deployed Worker unreachable: %s" % e)
              raise SystemExit(1)
          print("deployed Worker: %s%%   repo estimator: %s%%" % (live, repo))
          if (live < 0) != (repo < 0):
              print("FAIL: the deployed Worker contradicts the repo estimator "
                    "(the PR-5 bug class). Redeploy: cd api && npx wrangler deploy")
              raise SystemExit(1)
          print("OK: deployed Worker and repo estimator agree in direction")
          EOF

      # The deployed Worker's MCP surface: initialize handshake + one real
      # tool call. Non-blocking while the transport is new; promote once the
      # registry submission depends on it.
      - name: deployed /mcp smoke test (non-blocking)
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          import json, urllib.request
          url = "https://ecocompute-estimator.zhanghongping1982.workers.dev/mcp"
          hdrs = {
              "Content-Type": "application/json",
              "Accept": "application/json, text/event-stream",
              # Cloudflare bot rules 403 the default urllib UA (see above)
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                            "AppleWebKit/537.36 (KHTML, like Gecko) "
                            "Chrome/126.0 Safari/537.36"}

          def rpc(payload):
              req = urllib.request.Request(
                  url, data=json.dumps(payload).encode(), headers=hdrs, method="POST")
              return json.load(urllib.request.urlopen(req, timeout=20))

          init = rpc({"jsonrpc": "2.0", "id": 1, "method": "initialize",
                      "params": {"protocolVersion": "2025-03-26", "capabilities": {},
                                 "clientInfo": {"name": "ci-smoke", "version": "0.1"}}})
          server = init["result"]["serverInfo"]["name"]
          tools = rpc({"jsonrpc": "2.0", "id": 2, "method": "tools/list"})
          names = sorted(t["name"] for t in tools["result"]["tools"])
          call = rpc({"jsonrpc": "2.0", "id": 3, "method": "tools/call",
                      "params": {"name": "estimate_quantization_energy",
                                 "arguments": {"params_b": 7, "arch": "ada", "precision": "NF4"}}})
          text = call["result"]["content"][0]["text"]
          print("server: %s   tools: %s" % (server, ", ".join(names)))
          print("estimate(7B ada NF4) says: %s" % text.splitlines()[0])
          if len(names) != 4 or "-28." not in text:
              print("FAIL: MCP surface incomplete or wrong answer")
              raise SystemExit(1)
          print("OK: deployed /mcp answers with all four tools")
          EOF

      # Probe which client UAs Cloudflare's workers.dev bot rules let
      # through. Real MCP clients send their own UAs (node/undici, python,
      # custom), and a 403 there would make the registry URL unreachable
      # for them. Observational: prints the matrix, never fails the build.
      - name: workers.dev UA probe (informational)
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          import json, urllib.request, urllib.error
          url = "https://ecocompute-estimator.zhanghongping1982.workers.dev/mcp"
          payload = json.dumps({"jsonrpc": "2.0", "id": 1, "method": "initialize",
                                "params": {"protocolVersion": "2025-03-26",
                                           "capabilities": {},
                                           "clientInfo": {"name": "ua-probe", "version": "0"}}}).encode()
          uas = [
              "python-urllib/3.12",          # what the REST drift check saw 403'd
              "node",                         # node fetch default
              "undici",                       # node's fetch engine
              "axios/1.7",                    # common REST client
              "mcp-client/1.0",               # plausible MCP client UA
              "",                             # no UA at all
          ]
          for ua in uas:
              req = urllib.request.Request(url, data=payload, method="POST",
                      headers={"Content-Type": "application/json",
                               "Accept": "application/json, text/event-stream",
                               **({"User-Agent": ua} if ua else {})})
              try:
                  r = urllib.request.urlopen(req, timeout=20)
                  print("%-22s -> %s %s" % (repr(ua), r.status, "initialize ok" if b"serverInfo" in r.read()[:800] else "unexpected body"))
              except urllib.error.HTTPError as e:
                  print("%-22s -> HTTP %s (blocked)" % (repr(ua), e.code))
              except Exception as e:
                  print("%-22s -> error: %s" % (repr(ua), str(e)[:60]))
          EOF

      # Empirically check that the /mcp route sits behind the same per-IP
      # rate limiter as the REST endpoints (wrangler.toml [[ratelimits]]).
      # NOTE: Cloudflare's Rate Limiting API is permissive and eventually
      # consistent - a sub-second blitz passes clean (observed 2026-10-24:
      # 130 pings in 0.7s, all 200). So the probe hammers at a sustained
      # ~4 req/s for ~40s, the regime the limiter actually guards.
      # Observational: never fails the build, but WARNs loudly.
      - name: /mcp rate-limit probe (informational)
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          import http.client, json, time
          from collections import Counter
          host = "ecocompute-estimator.zhanghongping1982.workers.dev"
          payload = json.dumps({"jsonrpc": "2.0", "id": 1, "method": "ping"})
          headers = {"Content-Type": "application/json",
                     "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                                   "AppleWebKit/537.36 (KHTML, like Gecko) "
                                   "Chrome/126.0 Safari/537.36"}
          # Single keep-alive connection: pins one Cloudflare PoP, so the
          # per-location counter cannot be split across locations by
          # connection-level load balancing (separate connections may land
          # on different PoPs and each sees only a fraction of the load).
          conn = http.client.HTTPSConnection(host, timeout=20)
          codes, retry_after = [], None
          for i in range(140):
              conn.request("POST", "/mcp", body=payload, headers=headers)
              r = conn.getresponse()
              codes.append(r.status)
              if r.status == 429 and retry_after is None:
                  retry_after = r.getheader("retry-after")
              r.read()
              time.sleep(0.15)
          conn.close()
          c = Counter(codes)
          print("140 keep-alive /mcp pings over ~40s (pinned PoP):", dict(c),
                "retry-after:", retry_after)
          if c.get(429):
              print("OK: per-IP rate limiter covers /mcp (429 observed)")
          else:
              print("WARN: no 429 seen - the limiter may not be attached to /mcp")
          EOF

      # Funnel canary: one /v1/track beacon and one /mcp initialize, both
      # self-labelled ci_canary / ci-canary. After the run, `wrangler kv key
      # list` should show both events - the funnel is an instrument, and
      # instruments get health checks. 2026-10-24: the FUNNEL namespace was
      # found completely empty, so the beacon path has likely been silently
      # failing since 2026-10-12 (this canary exists to catch that class).
      - name: funnel canary (informational)
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          import json, urllib.request
          base = "https://ecocompute-estimator.zhanghongping1982.workers.dev"
          ua = {"Content-Type": "application/json",
                "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                              "AppleWebKit/537.36 (KHTML, like Gecko) "
                              "Chrome/126.0 Safari/537.36"}
          req = urllib.request.Request(base + "/v1/track",
                  data=json.dumps({"event": "ci_canary",
                                   "props": {"src": "github-actions"},
                                   "path": "/ci"}).encode(),
                  method="POST", headers=ua)
          r = urllib.request.urlopen(req, timeout=20)
          print("track canary:", r.status, "x-funnel:", r.headers.get("x-funnel"))
          req2 = urllib.request.Request(base + "/mcp",
                  data=json.dumps({"jsonrpc": "2.0", "id": 1, "method": "initialize",
                                   "params": {"protocolVersion": "2025-06-18",
                                              "clientInfo": {"name": "ci-canary",
                                                             "version": "0"}}}).encode(),
                  method="POST", headers=ua)
          r2 = urllib.request.urlopen(req2, timeout=20)
          print("mcp canary:", r2.status, "x-funnel:", r2.headers.get("x-funnel"))
          EOF
