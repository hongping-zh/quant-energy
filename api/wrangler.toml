# Cloudflare Worker config for the should-I-quantize REST endpoint.
# Deploy:  cd api && npx wrangler deploy   (needs a Cloudflare account + login/token)
name = "ecocompute-estimator"
main = "worker.js"
compatibility_date = "2024-09-23"

# Per-IP throttle for the public endpoint (Workers Rate Limiting API; needs
# wrangler >= 4.36.0). The Worker no-ops if the binding is missing, so an older
# wrangler can still deploy after deleting this block.
[[ratelimits]]
name = "API_RATE_LIMIT"
namespace_id = "1001"

[ratelimits.simple]
limit = 120
period = 60

# KV namespace for funnel analytics events (POST /v1/track).
[[kv_namespaces]]
binding = "FUNNEL"
id = "39df24ac9f2b4ffeb1a2c051db2bccea"

# Free-plan friendly. After deploy the URL is:
#   https://ecocompute-estimator.<your-subdomain>.workers.dev
# To attach a custom domain/route, add a [[routes]] block, e.g.:
# [[routes]]
# pattern = "api.yourdomain.com/*"
# zone_name = "yourdomain.com"
